name: Blog QA (QUILL — Copy Police)
on:
  schedule:
    - cron: '0 10 * * *'  # Daily 10:00 UTC — after SCRIBE (9:30), before PRESS (10:30)
  workflow_dispatch:

jobs:
  copy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 1: Run the automated 25-check scanner against all draft_ready blogs
      - name: Run Copy Police Scanner
        id: scanner
        run: |
          echo "Running 25-check copy audit..."
          python scripts/actions/copy_audit.py || echo "scanner_blocked=true" >> "$GITHUB_OUTPUT"

      # Step 2: Run the QUILL agent for deeper qualitative review
      # Only runs if there are draft_ready blogs that passed the scanner
      - name: Run QUILL Agent (Deep Review)
        if: steps.scanner.outputs.scanner_blocked != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/run_department.py blog_qa

      # Step 3: Notify on Telegram if blogs were blocked
      - name: Notify blocked blogs
        if: steps.scanner.outputs.scanner_blocked == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 -c "
          from scripts.actions.telegram_bot import send_message
          send_message('🚨 <b>QUILL — Blog(s) BLOCKED</b>\n\nOne or more blogs failed the 25-check copy audit.\nCheck the pipeline for details.\n\nBlogs will not publish until violations are fixed.')
          "

      - name: Push changes
        run: |
          git config user.name "Marketing Org Bot"
          git config user.email "bot@gadgetgeekspro.com"
          git add -A
          git diff --cached --quiet || git commit -m "[blog-qa] Copy audit — $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; git pull origin main --no-edit; }
            git push && break || sleep 5
          done
