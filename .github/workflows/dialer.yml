name: Dialer Department (Call List Builder)
on:
  schedule:
    - cron: '15 14 * * 1,2,3,4,5'  # Mon-Fri 2:15 PM UTC (morning PST)
  workflow_dispatch:

jobs:
  run-dialer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get fresh Shopify token
        id: shopify
        run: |
          RESPONSE=$(curl -s -X POST "https://gadgetgeekspro.myshopify.com/admin/oauth/access_token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=${{ secrets.SHOPIFY_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.SHOPIFY_CLIENT_SECRET }}")
          TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run Dialer (Build Call List)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          SHOPIFY_ACCESS_TOKEN: ${{ steps.shopify.outputs.token }}
        run: python scripts/run_department.py dialer

      - name: Push changes
        run: |
          git config user.name "Marketing Org Bot"
          git config user.email "bot@gadgetgeekspro.com"
          git add -A
          git diff --cached --quiet || git commit -m "[dialer] Automated run — $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; git pull origin main --no-edit; }
            git push && break || sleep 5
          done
