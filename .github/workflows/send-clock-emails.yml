name: Send Clock-In Emails

on:
  workflow_dispatch:

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Send clock-in emails to all employees
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          key = os.environ.get("RESEND_API_KEY", "")
          print(f"Key length: {len(key)}, starts with: {key[:5]}..." if key else "NO KEY FOUND")

          # Test with a simple email first
          data = json.dumps({
              "from": "Gadget Geeks Pro <noreply@gadgetgeekspro.com>",
              "to": ["nathaniela520@gmail.com"],
              "subject": "Test",
              "html": "<p>Test</p>",
          }).encode("utf-8")

          req = Request("https://api.resend.com/emails", data=data, headers={
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
          }, method="POST")

          try:
              with urlopen(req, timeout=30) as resp:
                  print(f"SUCCESS: {resp.read().decode()}")
          except HTTPError as e:
              body = e.read().decode() if e.fp else "no body"
              print(f"ERROR {e.code}: {body}")
          except Exception as e:
              print(f"EXCEPTION: {e}")
          PYEOF
