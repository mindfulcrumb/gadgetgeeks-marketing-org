name: Setup Telegram Webhook

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Register webhook with Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          WORKER_URL="https://gadgetgeeks-telegram-webhook.gadgetgeeks.workers.dev"
          echo "Registering webhook: $WORKER_URL"

          # First check current webhook status
          echo "--- Current webhook info ---"
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" | python3 -m json.tool

          # Set the webhook
          echo ""
          echo "--- Setting webhook ---"
          RESULT=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -d "url=${WORKER_URL}" \
            -d "allowed_updates=[\"message\",\"edited_message\"]" \
            -d "drop_pending_updates=false")
          echo "$RESULT" | python3 -m json.tool

          # Verify
          echo ""
          echo "--- Verifying webhook ---"
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" | python3 -m json.tool
