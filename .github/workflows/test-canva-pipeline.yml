name: "[TEST] Full Pipeline — Gemini → Shopify CDN → Canva → Export"
on:
  workflow_dispatch:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          CANVA_TOKEN_WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_API_SECRET: ${{ secrets.WORKER_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: cd scripts/actions && python test_canva_pipeline.py

      - name: Push test results
        run: |
          git config user.name "Marketing Org Bot"
          git config user.email "bot@gadgetgeekspro.com"
          git add -A
          git diff --cached --quiet || git commit -m "[test] Pipeline test — Gemini → Canva — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push || true
