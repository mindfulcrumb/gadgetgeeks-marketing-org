name: Test Gemini API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Gemini image generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          key = os.environ.get("GEMINI_API_KEY", "")
          print(f"Key present: {bool(key)}, length: {len(key)}")

          # Test 1: List available models
          models_url = f"https://generativelanguage.googleapis.com/v1beta/models?key={key}"
          try:
              req = Request(models_url)
              with urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode())
                  image_models = [m["name"] for m in data.get("models", []) if "image" in m.get("name", "").lower() or "imagen" in m.get("name", "").lower()]
                  flash_models = [m["name"] for m in data.get("models", []) if "flash" in m.get("name", "").lower()]
                  print(f"Image models: {image_models}")
                  print(f"Flash models: {flash_models[:5]}")
          except HTTPError as e:
              print(f"List models failed: {e.code} — {e.read().decode()[:200]}")

          # Test 2: Try generating with gemini-2.5-flash-image
          gen_url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-04-17:generateContent?key={key}"
          payload = {
              "contents": [{"parts": [{"text": "Generate a simple 16:9 image of a clean white desk with a refurbished iPhone on it, professional product photography, soft lighting"}]}],
              "generationConfig": {"responseModalities": ["TEXT", "IMAGE"]}
          }
          try:
              req = Request(gen_url, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"}, method="POST")
              with urlopen(req, timeout=30) as resp:
                  result = json.loads(resp.read().decode())
                  parts = result.get("candidates", [{}])[0].get("content", {}).get("parts", [])
                  has_image = any("inlineData" in p for p in parts)
                  print(f"Generation result: {'IMAGE RETURNED ✓' if has_image else 'NO IMAGE ✗'}")
                  if not has_image:
                      print(f"Response: {json.dumps(result)[:500]}")
          except HTTPError as e:
              body = e.read().decode()[:300] if e.fp else ""
              print(f"Generation failed: {e.code} — {body}")

          # Test 3: Try the model name from image_gen.py
          gen_url2 = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key={key}"
          try:
              req = Request(gen_url2, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"}, method="POST")
              with urlopen(req, timeout=30) as resp:
                  result = json.loads(resp.read().decode())
                  parts = result.get("candidates", [{}])[0].get("content", {}).get("parts", [])
                  has_image = any("inlineData" in p for p in parts)
                  print(f"gemini-2.5-flash-image result: {'IMAGE RETURNED ✓' if has_image else 'NO IMAGE ✗'}")
          except HTTPError as e:
              body = e.read().decode()[:300] if e.fp else ""
              print(f"gemini-2.5-flash-image failed: {e.code} — {body}")
          PYEOF
