<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GadgetGeeks HQ — God Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">
    <div class="hud-left">
      <span class="hud-title">GADGETGEEKS HQ</span>
      <span class="hud-badge">GOD MODE</span>
    </div>
    <div class="hud-center">
      <div class="hud-stat"><span class="hs-label">STAFF</span><span class="hs-val" id="hud-employees">10</span></div>
      <div class="hud-stat"><span class="hs-label">WORKING</span><span class="hs-val green" id="hud-working">0</span></div>
      <div class="hud-stat"><span class="hs-label">IDLE</span><span class="hs-val red" id="hud-idle">0</span></div>
      <div class="hud-stat"><span class="hs-label">QUEUE</span><span class="hs-val yellow" id="hud-queue">0</span></div>
    </div>
    <div class="hud-right">
      <a href="mission-control.html" id="mc-btn" style="display:inline-flex;align-items:center;gap:5px;padding:4px 12px;background:#00d4ff22;border:1px solid #00d4ff55;border-radius:4px;color:#00d4ff;font-family:'Press Start 2P',monospace;font-size:7px;text-decoration:none;letter-spacing:0.5px;cursor:pointer;transition:all 0.15s;" onmouseover="this.style.background='#00d4ff44';this.style.boxShadow='0 0 12px #00d4ff44'" onmouseout="this.style.background='#00d4ff22';this.style.boxShadow='none'">&#9632; MISSION CONTROL</a>
      <span class="hud-time" id="hud-time">--:--</span>
      <span class="hud-date" id="hud-date">---</span>
    </div>
  </div>
  <div id="main-area">
    <div id="office-wrapper">
      <canvas id="office" width="1120" height="736"></canvas>
      <div id="tooltip" class="hidden"></div>
      <div id="notifications"></div>
    </div>
    <div id="sidebar">
      <div class="sidebar-section" id="directory-section">
        <h2>EMPLOYEE DIRECTORY</h2>
        <div id="directory-list"></div>
      </div>
      <div class="sidebar-section hidden" id="employee-detail">
        <button class="back-btn" id="back-btn">&lt; BACK</button>
        <div id="employee-card"></div>
      </div>
      <div class="sidebar-section" id="enforcer-panel">
        <h2>GM ENFORCER LOG</h2>
        <div id="enforcer-log"></div>
      </div>
      <div class="sidebar-section" id="gallery-section">
        <h2>IMAGE PROMPT GALLERY</h2>
        <div id="gallery-stats"></div>
        <div id="gallery-folders"></div>
        <div class="hidden" id="gallery-detail">
          <button class="back-btn" id="gallery-back-btn">&lt; FOLDERS</button>
          <div id="gallery-prompts"></div>
        </div>
      </div>
      <div class="sidebar-section" id="queue-section">
        <h2>APPROVAL QUEUE</h2>
        <div id="queue-list"></div>
      </div>
    </div>
  </div>
  <div id="schedule-bar">
    <div class="sched-label">TODAY'S SCHEDULE</div>
    <div id="schedule-timeline"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
