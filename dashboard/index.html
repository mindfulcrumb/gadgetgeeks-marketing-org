<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GadgetGeeks HQ — God Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">
    <div class="hud-left">
      <span class="hud-title">GADGETGEEKS HQ</span>
      <span class="hud-badge">GOD MODE</span>
    </div>
    <div class="hud-center">
      <div class="hud-stat"><span class="hs-label">STAFF</span><span class="hs-val" id="hud-employees">20</span></div>
      <div class="hud-stat"><span class="hs-label">WORKING</span><span class="hs-val green" id="hud-working">0</span></div>
      <div class="hud-stat"><span class="hs-label">IDLE</span><span class="hs-val red" id="hud-idle">0</span></div>
      <div class="hud-stat"><span class="hs-label">QUEUE</span><span class="hs-val yellow" id="hud-queue">0</span></div>
    </div>
    <div class="hud-right" style="display:flex;align-items:center;gap:20px;">
      <a href="mission-control.html" id="mc-btn" style="font-family:'Press Start 2P',monospace;font-size:8px;color:#00d4ff;padding:6px 16px;border:1px solid #00d4ff;text-decoration:none;letter-spacing:2px;cursor:pointer;transition:all 0.2s;box-shadow:0 0 10px rgba(0,212,255,0.3);white-space:nowrap;" onmouseover="this.style.background='#00d4ff';this.style.color='#030310';this.style.boxShadow='0 0 20px rgba(0,212,255,0.6)'" onmouseout="this.style.background='none';this.style.color='#00d4ff';this.style.boxShadow='0 0 10px rgba(0,212,255,0.3)'">MISSION CONTROL</a>
      <div style="text-align:right;">
        <span class="hud-time" id="hud-time">--:--</span>
        <span class="hud-date" id="hud-date">---</span>
      </div>
    </div>
  </div>
  <div id="main-area">
    <div id="office-wrapper">
      <canvas id="office" width="1120" height="736"></canvas>
      <div id="tooltip" class="hidden"></div>
      <div id="notifications"></div>
    </div>
    <div id="sidebar">
      <div class="sidebar-section" id="directory-section">
        <h2>EMPLOYEE DIRECTORY</h2>
        <div id="directory-list"></div>
      </div>
      <div class="sidebar-section hidden" id="employee-detail">
        <button class="back-btn" id="back-btn">&lt; BACK</button>
        <div id="employee-card"></div>
      </div>
      <div class="sidebar-section" id="enforcer-panel">
        <h2>GM ENFORCER LOG</h2>
        <div id="enforcer-log"></div>
      </div>
      <div class="sidebar-section" id="gallery-section">
        <h2>IMAGE PROMPT GALLERY</h2>
        <div id="gallery-stats"></div>
        <div id="gallery-folders"></div>
        <div class="hidden" id="gallery-detail">
          <button class="back-btn" id="gallery-back-btn">&lt; FOLDERS</button>
          <div id="gallery-prompts"></div>
        </div>
      </div>
      <div class="sidebar-section" id="blog-pipeline-section">
        <h2>BLOG PIPELINE</h2>
        <div id="blog-pipeline-stats"></div>
        <div id="blog-pipeline-list"></div>
      </div>
      <div class="sidebar-section" id="queue-section">
        <h2>APPROVAL QUEUE</h2>
        <div id="queue-list"></div>
      </div>
      <div class="sidebar-section" id="comms-section">
        <h2>COMMS CENTER</h2>
        <div id="comms-tabs">
          <button class="comms-tab active" data-target="gm">GM</button>
        </div>
        <div id="comms-feed"></div>
        <div id="comms-input-area">
          <select id="comms-dept">
            <option value="gm">GM (All Depts)</option>
            <option value="intel">Market Intel</option>
            <option value="seo">SEO</option>
            <option value="content">Content</option>
            <option value="email">Email</option>
            <option value="social_morning">Social</option>
            <option value="cro">CRO</option>
            <option value="x_intel">X Intel</option>
            <option value="dialer">Dialer (Xavier)</option>
            <option value="image_prompts">Image Prompts</option>
            <option value="blog_writer">Blog Writer</option>
          </select>
          <div class="comms-row">
            <input type="text" id="comms-msg" placeholder="Type instruction..." />
            <button id="comms-send">SEND</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="schedule-bar">
    <div class="sched-label">TODAY'S SCHEDULE</div>
    <div id="schedule-timeline"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
